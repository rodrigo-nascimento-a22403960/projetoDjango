{% extends "portfolio/base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h2>{{ titulo }}</h2>
    
    <form method="POST" enctype="multipart/form-data" style="background: #f9f9f9; padding: 20px; border-radius: 8px;">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" style="background-color: #2ecc71; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; margin-top: 10px;">Guardar Artigo</button>
        <a href="{% url 'artigos_lista' %}" style="margin-left: 15px; color: #7f8c8d; text-decoration: none;">Cancelar</a>
    </form>
</div>
{% endblock %}
