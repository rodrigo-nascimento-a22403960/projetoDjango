{% extends "portfolio/base.html" %}

{% block content %}
<div style="max-width: 450px; margin: 80px auto; background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); font-family: 'Segoe UI', sans-serif;">
    <h2 style="text-align: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 25px; color: #2c3e50;">Link Mágico 🪄</h2>
    
    {% if mensagem %}
        <div style="background-color: #f8f9fa; border-left: 4px solid #9b59b6; padding: 15px; margin-bottom: 20px; color: #333; font-weight: bold;">
            {{ mensagem }}
        </div>
        <p style="text-align: center; margin-top: 20px;">
            <a href="{% url 'login' %}" style="color: #3498db; text-decoration: none; font-weight: bold;">Voltar ao Login Normal</a>
        </p>
    {% else %}
        <p style="color: #555; margin-bottom: 25px; text-align: center;">Insere o teu email. Vamos enviar-te um link mágico seguro para entrares sem password!</p>
        
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; color: #34495e; display: block; margin-bottom: 8px;">O teu Email:</label>
                <input type="email" name="email" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
            </div>
            <button type="submit" style="background-color: #8e44ad; color: white; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer;">
                ✨ Enviar Link Mágico
            </button>
        </form>
    {% endif %}
</div>
{% endblock %}
