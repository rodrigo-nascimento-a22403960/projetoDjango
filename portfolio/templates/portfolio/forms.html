{% extends "portfolio/base.html" %}

{% block content %}
<style>
    /* O contentor branco que segura o formulário */
    .form-modern-card {
        max-width: 600px;
        margin: 50px auto;
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .form-modern-card h2 {
        color: #2c3e50;
        margin-top: 0;
        margin-bottom: 30px;
        border-bottom: 2px solid #f0f0f0;
        padding-bottom: 15px;
    }

    /* Magia para separar os campos gerados pelo {{ form.as_p }} */
    .form-modern-card p {
        display: flex;
        flex-direction: column; /* Coloca o título (Label) em cima da caixa de texto */
        margin-bottom: 20px;
    }

    /* Estilo dos Títulos dos campos (Nome, Descrição, etc) */
    .form-modern-card label {
        font-weight: 600;
        color: #34495e;
        margin-bottom: 8px;
        font-size: 0.95em;
    }

    /* Estilo das caixas de texto, de datas, e selects */
    .form-modern-card input[type="text"],
    .form-modern-card input[type="url"],
    .form-modern-card input[type="number"],
    .form-modern-card input[type="date"],
    .form-modern-card input[type="email"],
    .form-modern-card textarea,
    .form-modern-card select {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 1em;
        font-family: inherit;
        box-sizing: border-box;
        transition: border-color 0.3s, box-shadow 0.3s;
        background-color: #fcfcfc;
    }

    /* O que acontece quando clicas dentro da caixa de texto */
    .form-modern-card input:focus,
    .form-modern-card textarea:focus,
    .form-modern-card select:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        background-color: #ffffff;
    }

    /* Estilo do botão de Guardar */
    .btn-guardar {
        background-color: #2ecc71;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 1.05em;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-right: 15px;
        margin-top: 10px;
    }
    .btn-guardar:hover { background-color: #27ae60; }

    /* Estilo do link de Cancelar */
    .btn-cancelar {
        color: #e74c3c;
        text-decoration: none;
        font-weight: 600;
        font-size: 1em;
        transition: color 0.3s;
    }
    .btn-cancelar:hover { color: #c0392b; text-decoration: underline; }

    /* Pequeno ajuste para a caixa de descrição não ficar gigante */
    .form-modern-card textarea { height: 120px; resize: vertical; }
    
    /* Textos de ajuda minúsculos que o Django às vezes junta */
    .helptext { font-size: 0.85em; color: #7f8c8d; margin-top: 5px; }
</style>

<div class="form-modern-card">
    <!-- Título genérico que serve tanto para Criar como para Editar -->
    <h2>Preencher Dados</h2>

    <!-- O enctype="multipart/form-data" é OBRIGATÓRIO por causa das imagens! -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- Onde a magia do Django acontece -->
        {{ form.as_p }}

        <div style="margin-top: 30px;">
            <button type="submit" class="btn-guardar">Guardar</button>
            <a href="javascript:history.back()" class="btn-cancelar">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
